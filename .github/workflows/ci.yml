name: ci

on:
  push:
    branches: [main, staging, dev]
  pull_request:
    branches: [main, staging, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Build
  # ============================================================================
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install

      - name: Run build
        run: pnpm build

  # ============================================================================
  # Lint
  # ============================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install

      - name: Run prettier check
        run: pnpm format:check

      - name: Run lint
        run: pnpm lint

  # ============================================================================
  # Tests (matrix: Node 20, 22, 24)
  # ============================================================================
  test:
    name: Tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install

      - name: Run tests
        run: pnpm test

      # Apps/web SEO regression suite (apps/web/tests/seo). Runs after the
      # root test pipeline so we benefit from the existing install cache.
      # The suite is a pure-Vitest run; no real Next build is required.
      - name: Run apps/web SEO tests
        run: pnpm --filter web test:run

      # Apps/web has a test-specific tsconfig that enables
      # `allowImportingTsExtensions` so tests can target routes whose
      # directory names contain a dot (e.g. `llms.txt/route.ts`). The
      # production tsconfig does not enable it, so we run type-check:test
      # explicitly. The regular `pnpm turbo type-check` is run on the
      # rest of the workspace by the `Type Check` job below. The
      # `Type Check (Tests)` job runs the same for @deessejs/errors.
      - name: Type-check apps/web test suite
        run: pnpm --filter web type-check:test

  # ============================================================================
  # Type Check (matrix: Node 20, 22, 24)
  # ============================================================================
  type-check:
    name: Type Check (node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install

      - name: Run type check
        run: pnpm turbo type-check

  # ============================================================================
  # Type Check (Tests) — exercises the test files in @deessejs/errors
  # ============================================================================
  type-check-tests:
    name: Type Check (Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install

      # The standard `pnpm turbo type-check` runs `tsc --noEmit` against
      # the source tsconfig which includes only `src/`. The
      # `tsconfig.test.json` extends the base and includes the test
      # files; this job catches regressions in the type-level tests
      # that the source typecheck would silently miss.
      - name: Run type check on tests
        run: pnpm --filter @deessejs/errors type-check:test

  # ============================================================================
  # Consumer from dist — proves the published entry point is consumable
  # ============================================================================
  consumer-from-dist:
    name: Consumer from dist
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install

      # The script builds first (tsc -p tsconfig.build.json) and
      # then runs tests/consumer-from-dist.mjs which imports
      # dist/index.js and exercises the public API.
      - name: Build and run consumer smoke test
        run: pnpm --filter @deessejs/errors test:consumer

  # ============================================================================
  # Docs examples — public example blocks in apps/web/content/docs/*.mdx
  # must compile against the published dist/index.d.ts. The probe
  # walks every fenced TypeScript code block, runs tsc on each in
  # isolation, and reports drift between the docs and the public API.
  # ============================================================================
  docs-examples-typecheck:
    name: Docs examples type-check
    runs-on: ubuntu-latest
    # Restrict the GITHUB_TOKEN to read-only; the job only
    # checks out code and runs tsc, no write access needed.
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # Builds first (tsc -p tsconfig.build.json), then walks
      # the MDX code blocks in apps/web/content/docs/ and runs
      # tsc against the published dist/index.d.ts.
      - name: Build and type-check public examples
        run: pnpm --filter @deessejs/errors test:docs

  # ============================================================================
  # Changeset required (PRs to staging only)
  # ============================================================================
  changeset-check:
    name: Changeset required
    if: github.event_name == 'pull_request' && github.base_ref == 'staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch staging
        run: git fetch origin staging
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require changeset
        run: |
          changed=$(git diff --name-only origin/staging...HEAD)
          if ! echo "$changed" | grep -q '^\.changeset/.*\.md$'; then
            echo "::error::This PR must include a changeset file (.changeset/<slug>.md)."
            exit 1
          fi
      - name: Validate changeset format
        run: pnpm changeset status --since=origin/staging
