name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip publish and tag push'
        type: boolean
        default: false
      packages:
        description: 'Restrict to a subset of packages (comma-separated). Empty = all.'
        type: string
        default: ''

  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: release
    # Run when a PR is merged into main OR manually triggered
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == 'main')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Detect pending changesets
        id: detect
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q '^\.changeset/.*\.md$'; then
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create versions from changesets
        if: steps.detect.outputs.has_changesets == 'true'
        run: pnpm changeset version

      - name: Commit version changes and push
        if: steps.detect.outputs.has_changesets == 'true' && (github.event_name == 'workflow_dispatch' || inputs.dry_run != true)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          # Use --cached: after `git add -A`, the diff against the index is empty.
          # `git diff --quiet` (without --cached) compares the working tree to the
          # index, which is already in sync, so the commit was never created.
          git diff --cached --quiet || git commit -m "chore(release): version packages"
          git push origin HEAD
          git push --tags

      - name: Build
        if: steps.detect.outputs.has_changesets == 'true' && (github.event_name == 'workflow_dispatch' || inputs.dry_run != true)
        run: pnpm build

      - name: Test
        if: steps.detect.outputs.has_changesets == 'true' && (github.event_name == 'workflow_dispatch' || inputs.dry_run != true)
        run: pnpm test

      - name: Publish packages
        if: steps.detect.outputs.has_changesets == 'true' && (github.event_name == 'workflow_dispatch' || inputs.dry_run != true)
        run: |
          if [ -n "${{ inputs.packages }}" ]; then
            pnpm changeset publish --packages=$(echo "${{ inputs.packages }}" | tr ',' ' ')
          else
            pnpm changeset publish
          fi

      - name: Get latest tag
        id: tag
        if: steps.detect.outputs.has_changesets == 'true' && (github.event_name == 'workflow_dispatch' || inputs.dry_run != true)
        run: echo "version=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.detect.outputs.has_changesets == 'true' && (github.event_name == 'workflow_dispatch' || inputs.dry_run != true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          body_path: packages/errors/CHANGELOG.md
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
